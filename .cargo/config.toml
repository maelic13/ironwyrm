# NO `[build] rustflags` HERE — deliberately.
#
# This file carried `rustflags = ["-C", "target-cpu=native"]` from 1.0.0 until
# 2.3.0, when it was removed as both redundant and actively harmful:
#
#   REDUNDANT — every build path that matters sets its own flags, and an
#   explicit `CARGO_ENCODED_RUSTFLAGS`/`RUSTFLAGS` overrides this file anyway:
#     * release assets     -> `cargo xtask build --arch {base,avx2,pext,arm64}`
#                             pins x86-64 / x86-64-v3 / +bmi2 / generic;
#     * SPRT/gate binaries -> tools/build_test.ps1 (xtask pext + PGO);
#     * tune binaries      -> build_test.ps1 sets RUSTFLAGS explicitly.
#   Only a bare `cargo build` / `cargo test` ever read it — CI and casual
#   local builds.
#
#   HARMFUL — `[build] rustflags` applies to BUILD SCRIPTS and proc macros too,
#   and those run on the HOST. CI caches `target/` (Swatinem/rust-cache), so a
#   build script compiled with native codegen on one runner CPU is restored
#   onto a runner with a different CPU and dies with STATUS_ILLEGAL_INSTRUCTION
#   (0xc000001d). That is exactly what failed `bench windows-x86-64` during the
#   2.3.0 release, having passed on identical code one run earlier — the
#   intermittency IS the tell. It was also a portability trap generally: a
#   plain `cargo build --release` produced a machine-specific binary.
#
# Want a native build? Ask explicitly: `cargo xtask build --arch native`, or
# `tools/build_test.ps1 -Native`.

[alias]
xtask = "run --package xtask --"

# 9.0a: libtest runs each test on a thread with the default stack. Rarog's
# `Searcher` is ~35 KB inline (pv_table alone is 32 KB) and DEBUG frames are
# unoptimised, so tests that build an Engine overflowed and `cargo test` died
# outright — which meant no `debug_assert!` in the crate was ever exercised.
# Release builds and production were never affected: main.rs and
# search_threads.rs already size their threads explicitly (16 MB each).
# This gives test threads the same budget so the debug suite — and with it the
# whole debug_assert layer — actually runs.
[env]
RUST_MIN_STACK = "16777216"
